# Sitio de la actividad ING Requisitos (GEA). Estático, servido por nginx desde /var/www.
# Independiente de la app de Next.js: estas peticiones nunca llegan a cv_web.

location = /ing-requisitos {
    return 301 /ing-requisitos/;
}

# Archivos ocultos (.git, .env, ...): nunca se sirven. Este prefijo es más largo que el de abajo, así que gana.
location ^~ /ing-requisitos/. {
    return 404;
}

location ^~ /ing-requisitos/ {
    root /var/www/ing-requisitos/current;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;
    limit_except GET HEAD {
        deny all;
    }

    # Un location con add_header no hereda las cabeceras del server: se vuelven a poner aquí.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
